<style>:root{
  --bg:#F4F5FC;--card:#fff;--card2:#F8F8FE;--text:#1B1A3D;--muted:#7C80A0;--line:#E7E8F5;
  --p:#5B4CF0;--p2:#7B61FF;--p3:#9D8CFF;--soft:#EEEBFF;--soft2:#F5F3FF;
  --green:#1FAE7A;--gsoft:#E3F7EF;--orange:#F59E0B;--osoft:#FFF4E0;--red:#EF4460;--rsoft:#FDE8EC;--blue:#3B82F6;--bsoft:#E6F0FF;
  --shadow:0 8px 28px rgba(79,64,200,.08);--shadow2:0 14px 40px rgba(79,64,200,.16);
  --r:18px;--r2:12px;
  --grad:linear-gradient(135deg,#5B4CF0 0%,#7B61FF 100%);
  --hero:linear-gradient(120deg,#F2F0FF 0%,#ECEBFF 55%,#E6E4FF 100%);
  font-family:"Manrope","Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12122A;--card:#1C1C3A;--card2:#23234A;--text:#EDEBFF;--muted:#A3A5C8;--line:#2E2E58;
  --soft:#2B2860;--soft2:#24224F;--gsoft:#173B35;--osoft:#3D3120;--rsoft:#43202C;--bsoft:#1D2E52;
  --shadow:0 8px 28px rgba(0,0,0,.35);--shadow2:0 14px 40px rgba(0,0,0,.5);
  --hero:linear-gradient(120deg,#25235A 0%,#2A2766 60%,#2E2A70 100%);
;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12122A;--card:#1C1C3A;--card2:#23234A;--text:#EDEBFF;--muted:#A3A5C8;--line:#2E2E58;
  --soft:#2B2860;--soft2:#24224F;--gsoft:#173B35;--osoft:#3D3120;--rsoft:#43202C;--bsoft:#1D2E52;
  --shadow:0 8px 28px rgba(0,0,0,.35);--shadow2:0 14px 40px rgba(0,0,0,.5);
  --hero:linear-gradient(120deg,#25235A 0%,#2A2766 60%,#2E2A70 100%);
;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--p);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:30px;font-weight:800;letter-spacing:-.4px}
h2{font-size:19px;font-weight:800}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.b{font-weight:700}.center{text-align:center}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}svg.i.lg{width:26px;height:26px}
.hidden{display:none!important}
.mark{width:40px;height:41px;flex:none}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;z-index:40}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px;cursor:pointer}
.logo b{font-size:21px;font-weight:800;color:var(--text);letter-spacing:-.3px}.logo b span{color:var(--p)}
.logo small{display:block;font-size:10.5px;color:var(--muted);margin-top:-3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--text);font-weight:600;font-size:14px}
.nav a:hover{background:var(--soft2)}
.nav a.on{background:var(--soft);color:var(--p)}
.nav .sep{font-size:11px;color:var(--muted);padding:10px 14px 2px;text-transform:uppercase;letter-spacing:.6px}
.nav .cnt{margin-left:auto;background:var(--p);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.side-card{margin-top:auto;background:var(--hero);border-radius:var(--r);padding:16px;font-weight:700;font-size:13.5px;line-height:1.45}
.side-card .muted{font-weight:500}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px 11px 42px;outline:none}
.search input:focus{border-color:var(--p3);box-shadow:0 0 0 4px var(--soft)}
.search>svg{position:absolute;left:14px;top:11px;color:var(--muted)}
.drop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);padding:8px;max-height:420px;overflow:auto;z-index:50}
.drop .grp{font-size:11px;color:var(--muted);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.5px}
.drop a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--text);cursor:pointer}
.drop a:hover{background:var(--soft2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.user{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;font-weight:700}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none;background:var(--grad)}
.av.sm{width:32px;height:32px;font-size:12px}
.menu{position:absolute;right:0;top:calc(100% + 10px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);padding:8px;z-index:60}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--text);cursor:pointer;font-weight:600;text-align:left}
.menu a:hover,.menu button:hover{background:var(--soft2)}
.menu .hd{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.notif{width:340px;max-height:420px;overflow:auto}
.notif .n{display:flex;gap:10px;padding:10px;border-radius:10px;font-size:12.5px}
.notif .n.new{background:var(--soft2)}
.burger{display:none}
.page{padding:6px 28px 28px;max-width:1320px;width:100%;flex:1}
.foot{display:flex;align-items:center;gap:30px;flex-wrap:wrap;padding:22px 28px;border-top:1px solid var(--line);margin-top:10px;font-size:12.5px}
.foot nav{display:flex;gap:28px;flex-wrap:wrap;margin:0 auto}
.foot nav a{color:var(--text);cursor:pointer}
.foot .copy{color:var(--muted)}

/* grids */
.g{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.split-r{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:12px}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.mt{margin-top:20px}.mt-s{margin-top:10px}.mb{margin-bottom:20px}.mb-s{margin-bottom:10px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card.pad-s{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.card-h a,.link{font-size:12.5px;font-weight:700;color:var(--p);display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0}
.hero{position:relative;overflow:hidden;background:var(--hero);border-radius:22px;padding:30px 32px;min-height:190px;display:flex;align-items:center;border:1px solid var(--line)}
.hero .txt{position:relative;z-index:2;max-width:58%}
.hero .kick{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--p);margin-bottom:10px}
.hero p{color:var(--muted);font-size:15px;margin-top:10px;max-width:520px}
.hero .art{position:absolute;right:20px;bottom:0;top:0;width:40%;display:flex;align-items:center;justify-content:flex-end;pointer-events:none}
.hero .art svg{max-height:100%;width:auto;max-width:100%}
.chips-info{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.info{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:150px}
.info .ic{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--p);display:grid;place-items:center;flex:none}
.info small{display:block;color:var(--muted);font-size:11px}.info b{font-size:12.5px}
.qcard{display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
.qcard:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.ic-box{width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--p);display:grid;place-items:center;flex:none;font-weight:800;font-size:18px}
.ic-box.lg{width:54px;height:54px;border-radius:16px;font-size:22px}
.ic-box.sm{width:36px;height:36px;border-radius:11px;font-size:14px}
.ic-box.g{background:var(--gsoft);color:var(--green)}.ic-box.o{background:var(--osoft);color:var(--orange)}.ic-box.r{background:var(--rsoft);color:var(--red)}.ic-box.bl{background:var(--bsoft);color:var(--blue)}
.mathic{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(91,76,240,.28);transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.light{background:#fff;color:var(--p);box-shadow:none}
.btn.soft{background:var(--soft);color:var(--p);box-shadow:none}
.btn.danger{background:var(--rsoft);color:var(--red);box-shadow:none}
.btn.ok{background:var(--gsoft);color:var(--green);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.circ{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;border:0;cursor:pointer;flex:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--text)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(91,76,240,.25)}
.chips{display:flex;gap:10px;overflow:auto;padding:4px 2px;scrollbar-width:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--p);white-space:nowrap}
.badge.g{background:var(--gsoft);color:var(--green)}.badge.o{background:var(--osoft);color:var(--orange)}.badge.r{background:var(--rsoft);color:var(--red)}.badge.bl{background:var(--bsoft);color:var(--blue)}.badge.gr{background:var(--card2);color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:11.5px;color:var(--muted);font-weight:600}

/* progress */
.bar{height:7px;border-radius:10px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:10px;background:var(--grad);transition:width .6s}
.bar.g>i{background:var(--green)}.bar.o>i{background:var(--orange)}.bar.r>i{background:var(--red)}.bar.bl>i{background:var(--blue)}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring .v{position:absolute;text-align:center}
.ring .v b{display:block;font-size:28px;font-weight:800}
.ring svg{transform:rotate(-90deg)}
.stat{display:flex;align-items:center;gap:14px;background:var(--card2);border-radius:14px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:16px}
.stat.g{background:var(--gsoft)}.stat.o{background:var(--osoft)}.stat.p{background:var(--soft2)}
.kpi{display:flex;align-items:center;gap:14px}
.kpi b{font-size:22px;display:block;font-weight:800}

/* lists */
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700;font-size:13.5px}
.li .s{font-size:12px;color:var(--muted)}
.li.click{cursor:pointer}
.li.click:hover .t{color:var(--p)}
.boxli{display:flex;align-items:center;gap:14px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.boxli:last-child{margin-bottom:0}
.boxli.click{cursor:pointer}.boxli.click:hover{border-color:var(--p3)}
.timepill{background:var(--soft2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.rank{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--soft);color:var(--p);flex:none}
.rank.r1{background:#FFF1CC;color:#B7791F}.rank.r2{background:#E3F7EF;color:#1FAE7A}.rank.r3{background:#E6F0FF;color:#3B82F6}
.meRow{background:var(--soft2);border-radius:12px;padding:10px!important;border:0!important}

/* subject cards */
.scard{display:flex;flex-direction:column;gap:12px;transition:.15s}
.scard:hover{box-shadow:var(--shadow2)}
.scard .desc{color:var(--muted);font-size:12.5px;min-height:38px}
.mini{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.mini:hover{border-color:var(--p3)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:10px 12px;background:var(--card2)}
.tbl th:first-child{border-radius:10px 0 0 10px}.tbl th:last-child{border-radius:0 10px 10px 0}
.tbl td{padding:12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow:auto}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.pager button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.pager button.on{background:var(--grad);color:#fff;border:0}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.field label{font-weight:700;font-size:13px}
.inp{position:relative}
.inp>svg.i{position:absolute;left:13px;top:12px;color:var(--muted);pointer-events:none}
.inp .eye{position:absolute;right:8px;top:6px;border:0;background:none;cursor:pointer;color:var(--muted);padding:6px}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;outline:none;transition:.15s}
.inp input.in,.inp select.in{padding-left:42px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--p3);box-shadow:0 0 0 4px var(--soft)}
textarea.in{resize:vertical;min-height:90px}
.err{color:var(--red);font-size:12.5px;font-weight:600;min-height:18px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--p);flex:none;margin-top:1px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;cursor:pointer;font-weight:700}
.seg button.on{border-color:var(--p);background:var(--soft);color:var(--p)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--p);box-shadow:var(--shadow)}
.strength{display:flex;gap:4px;margin-top:4px}.strength i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.strength i.on1{background:var(--red)}.strength i.on2{background:var(--orange)}.strength i.on3{background:var(--green)}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--bg)}
.auth-art{background:var(--hero);display:flex;flex-direction:column;justify-content:center;padding:56px;gap:22px;position:relative;overflow:hidden}
.auth-art h1{font-size:36px;max-width:540px}
.auth-art h1 span{color:var(--p)}
.auth-art p{color:var(--muted);font-size:15px;max-width:480px}
.auth-art .art svg{width:100%;max-width:440px;height:auto}
.auth-box{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.auth-card{width:100%;max-width:440px}
.auth-card h2{font-size:26px;margin:18px 0 6px}
.feat4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.feat4 div{text-align:center;font-size:12px;font-weight:700}
.feat4 .ic-box{margin:0 auto 6px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:16px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.stepper{display:flex;align-items:flex-start;margin:22px 0 26px}
.stepper .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;text-align:center}
.stepper .st:not(:last-child):after{content:"";position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line)}
.stepper .st.done:not(:last-child):after{background:var(--p)}
.stepper .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--p);font-weight:800}
.stepper .st.on .n,.stepper .st.done .n{background:var(--grad);color:#fff}
.stepper .st.on,.stepper .st.done{color:var(--text)}
.demo-acc{margin-top:22px;border:1px dashed var(--p3);border-radius:14px;padding:14px;background:var(--soft2)}
.demo-acc .row{margin-top:8px}
.sumrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.sumrow:last-child{border-bottom:0}.sumrow span{color:var(--muted);width:140px;flex:none}
.bigok{width:84px;height:84px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;margin:10px auto 16px;box-shadow:0 12px 30px rgba(91,76,240,.35)}

/* test runner */
.q-opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--card);font-weight:600;transition:.12s;text-align:left;width:100%}
.opt:hover{border-color:var(--p3)}
.opt .l{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800;flex:none}
.opt.sel{border-color:var(--p);background:var(--soft2)}
.opt.sel .l{background:var(--grad);color:#fff}
.opt.right{border-color:var(--green);background:var(--gsoft)}.opt.right .l{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--rsoft)}.opt.wrong .l{background:var(--red);color:#fff}
.qnums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qnums button{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;position:relative}
.qnums button.ans{background:var(--soft);color:var(--p);border-color:var(--p3)}
.qnums button.cur{outline:2px solid var(--p)}
.qnums button.flag:after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.qnums button.ok{background:var(--gsoft);color:var(--green);border-color:var(--green)}
.qnums button.bad{background:var(--rsoft);color:var(--red);border-color:var(--red)}
.timer{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.qtext{font-size:17px;font-weight:700;line-height:1.55}
.explain{margin-top:10px;background:var(--card2);border-radius:12px;padding:12px 14px;font-size:13px}
.m{font-family:"Cambria Math","Times New Roman",serif;font-size:1.08em}

/* ai */
.chat{display:flex;flex-direction:column;gap:16px;max-height:560px;overflow:auto;padding-right:4px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .bub{background:var(--card2);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 16px;max-width:88%;font-size:13.5px;min-width:0}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--grad);color:#fff;border:0;border-radius:16px 4px 16px 16px}
.msg .bot{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--p)}
.bub .formula{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;font-family:"Cambria Math","Times New Roman",serif;font-size:16px;overflow:auto;white-space:nowrap}
.bub ol,.bub ul{margin:6px 0;padding-left:20px}.bub li{margin:3px 0}
.bub .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bub .meta{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.bub .meta button{border:0;background:none;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:2px;font-size:11.5px}
.bub .meta button.on{color:var(--p)}
.bub table{border-collapse:collapse;margin:6px 0}.bub td{border:1px solid var(--line);padding:4px 10px;text-align:center;font-family:"Cambria Math",serif}
.composer{display:flex;align-items:flex-end;gap:10px;border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;background:var(--card)}
.composer textarea{flex:1;border:0;outline:none;resize:none;background:none;min-height:24px;max-height:160px;padding:8px 0}
.composer:focus-within{border-color:var(--p3);box-shadow:0 0 0 4px var(--soft)}
.sendbtn{width:44px;height:44px;border-radius:50%;background:var(--grad);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p3);margin-right:4px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
sup{font-size:.72em}

/* promo */
.promo{background:var(--grad);color:#fff;border-radius:var(--r);padding:22px;position:relative;overflow:hidden}
.promo p{opacity:.88;font-size:13px;margin-top:6px}
.promo .ic-box{background:rgba(255,255,255,.18);color:#fff;margin-bottom:12px}
.banner{background:var(--grad);color:#fff;border-radius:22px;padding:24px 30px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
.banner .ic-box{background:rgba(255,255,255,.18);color:#fff}
.banner p{opacity:.85;font-size:13px}
.banner .btn{position:relative;z-index:1;margin-left:auto}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12.5px}
.cal .h{color:var(--muted);font-size:11.5px;padding:4px 0}
.cal button{aspect-ratio:1;border:0;background:none;border-radius:50%;cursor:pointer;font-weight:600;position:relative;color:var(--text);max-width:38px;margin:auto;width:100%;padding:0}
.cal button:hover{background:var(--soft2)}
.cal button.td{background:var(--grad);color:#fff}
.cal button.sel{outline:2px solid var(--p3)}
.cal button.ev:after{content:"";position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--orange)}

/* book covers */
.cover{aspect-ratio:3/4;border-radius:10px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 10px 20px rgba(30,20,90,.2)}
.cover b{font-size:12px;letter-spacing:.8px;text-transform:uppercase;line-height:1.3;position:relative;z-index:1}
.cover small{font-size:9.5px;opacity:.85;position:relative;z-index:1}
.cover svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:55%;opacity:.5}
.bookc{display:flex;flex-direction:column;gap:8px}
.bookc .cv-wrap{position:relative;padding:0 12px 6px}
.bookc .cv-wrap .badge{position:absolute;left:4px;bottom:-4px;z-index:2}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(20,18,60,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:fade .15s}
.modal{background:var(--card);border-radius:20px;padding:26px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:var(--shadow2);position:relative}
.modal.wide{max-width:780px}
.modal .x{position:absolute;right:14px;top:14px}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{background:var(--text);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow2);animation:fade .2s;max-width:360px}
.toast.ok{background:var(--green);color:#fff}.toast.bad{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}
.topic{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;background:var(--card);overflow:hidden}
.topic>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.topic>summary::-webkit-details-marker{display:none}
.topic[open]>summary{border-bottom:1px solid var(--line)}
.topic .body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.formula-box{background:var(--soft2);border-left:4px solid var(--p);border-radius:10px;padding:12px 16px;font-family:"Cambria Math","Times New Roman",serif;font-size:16px;overflow:auto}
.ach-list{display:flex;gap:12px;flex-wrap:wrap}
.ach{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;text-align:center;font-size:11.5px;font-weight:700}
.ach .ic-box{width:56px;height:56px;border-radius:50%}
.ach.off{opacity:.35;filter:grayscale(1)}
.kmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kmap .cell{border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid transparent}
.kmap .cell small{display:block;font-weight:600;opacity:.8}
.scrim{display:none}
.chartwrap svg{width:100%;height:auto;display:block}
.chartwrap text{fill:var(--muted);font-size:11px}

@media (max-width:1180px){.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow2)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .burger{display:grid}
  .split-r,.g3,.g2{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}.auth-art{display:none}
  .hero .txt{max-width:100%}.hero .art{opacity:.18}
}
@media (max-width:640px){
  .top{padding:10px 14px;gap:8px}.page{padding:4px 14px 20px}
  .user .nm{display:none}
  .g4{grid-template-columns:1fr 1fr;gap:12px}
  h1{font-size:23px}.hero{padding:22px}
  .card{padding:16px}
  .banner{flex-wrap:wrap;padding:20px}.banner .btn{margin-left:0}
  .foot{padding:18px 14px}
  .qnums{grid-template-columns:repeat(6,1fr)}
  .tbl .hm{display:none}
  .notif{width:290px}
}
@media print{.side,.top,.foot{display:none}.app{display:block}}
.split>*,.split-r>*,.g>*,.stack>*{min-width:0}
@media (max-width:640px){.info{min-width:0;flex:1 1 140px}.chips-info{gap:8px}.hero .art{display:none}}

@media (max-width:640px){.qcard{flex-direction:column;align-items:flex-start;gap:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn:focus-visible,.chip:focus-visible,.iconbtn:focus-visible,a:focus-visible,.circ:focus-visible{outline:3px solid var(--p3);outline-offset:2px}
</style>
</head>
<body>

/* ===== sha256.js — SHA-256 (FIPS 180-4), tashqi kutubxonasiz; parollar tuz (salt) bilan xeshlanadi ===== */
"use strict";
const SHA256 = (() => {
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,
    0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,
    0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,
    0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  function hash(str) {
    const bytes = new TextEncoder().encode(str);
    const len = bytes.length, bitLen = len * 8;
    const total = ((len + 9 + 63) >> 6) << 6;
    const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
    const dv = new DataView(m.buffer);
    dv.setUint32(total - 8, Math.floor(bitLen / 2 ** 32)); dv.setUint32(total - 4, bitLen >>> 0);
    const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
    const W = new Uint32Array(64);
    for (let o = 0; o < total; o += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(W[i-15],7) ^ rotr(W[i-15],18) ^ (W[i-15] >>> 3);
        const s1 = rotr(W[i-2],17) ^ rotr(W[i-2],19) ^ (W[i-2] >>> 10);
        W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25), ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + W[i]) | 0;
        const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22), mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;
    }
    return Array.from(H, (x) => x.toString(16).padStart(8, "0")).join("");
  }
  const salt = () => Array.from({ length: 16 }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, "0")).join("");
  /* 1000 marta takrorlash — lug'at hujumini sekinlashtiradi */
  const pass = (pw, s) => { let h = s + ":" + pw; for (let i = 0; i < 1000; i++) h = hash(h + s); return h; };
  return { hash, salt, pass };
})();

"use strict";
const Store = (() => {
  const KEY = "pmedu_db_v1";
  const SESSION_HOURS = 8, MAX_FAILS = 5, LOCK_MIN = 5;
  let mem = null, db = null, persistent = true;

  const read = () => { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { persistent = false; return mem; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { persistent = false; mem = JSON.parse(JSON.stringify(db)); } };

  /* Deterministik tasodifiy generator (seed ma'lumotlari har safar bir xil bo'lishi uchun) */
  const rng = (seed) => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };

  function mkUser(o) {
    const salt = SHA256.salt();
    return { id: o.id || U.uid("u"), email: o.email.toLowerCase(), salt, hash: SHA256.pass(o.password, salt), role: o.role || "student",
      first: o.first, last: o.last, uni: o.uni || "", faculty: o.faculty || "", course: o.course || 1, year: o.year || "2025 - 2026",
      group: o.group || "", createdAt: o.createdAt || Date.now(), blocked: false, demo: !!o.demo };
  }

  function seedAttempts(d, uid, skill, n, r) {
    const now = Date.now();
    for (let k = 0; k < n; k++) {
      const t = DATA.TESTS[Math.floor(r() * DATA.TESTS.length)];
      const qs = DATA.QUESTIONS.filter((q) => t.topics.includes(q.t)).slice(0, 10);
      const sk = skill[t.s] ?? 0.6;
      const items = qs.map((q) => { const ok = r() < sk; const wrong = (q.a + 1 + Math.floor(r() * 3)) % 4; return { qid: q.id, t: q.t, given: ok ? q.a : wrong, ok }; });
      const score = items.filter((i) => i.ok).length;
      const ts = now - Math.floor((n - k) * (9 / n) * 864e5) - Math.floor(r() * 5e6);
      d.attempts.push({ id: U.uid("at"), uid, testId: t.id, title: t.title, s: t.s, startedAt: ts - 9e5, finishedAt: ts, items, score, total: items.length, pct: U.pct(score, items.length), mode: "test" });
    }
  }

  function seed() {
    const d = { v: 1, users: [], attempts: [], learned: {}, goals: [], events: [], activity: [], notifs: [], chats: [], assignments: [], suggestions: [], books: [], lock: {}, secLog: [], session: null, createdAt: Date.now() };

    const ustoz = mkUser({ id: "u_ustoz", email: "ustoz@pmedu.uz", password: "demo123", role: "teacher", first: "Rustam", last: "Karimov", uni: DATA.UNIVERSITIES[0], faculty: "Amaliy matematika", demo: true });
    const admin = mkUser({ id: "u_admin", email: "admin@pmedu.uz", password: "admin123", role: "admin", first: "Administrator", last: "", demo: true });
    d.users.push(dunyo, ustoz, admin);
    const r = rng(20260929);
    DATA.PEERS.forEach((p, i) => {
      const u = mkUser({ email: `${p.first.toLowerCase()}.${p.last.toLowerCase()}@pmedu.uz`, password: "demo123", first: p.first, last: p.last, uni: DATA.UNIVERSITIES[0], faculty: "Amaliy matematika", course: 2, group: i % 2 ? "AM-22" : "AM-21", demo: true });
      d.users.push(u);
      const sk = {}; DATA.SUBJECTS.forEach((s) => (sk[s.id] = Math.min(0.99, p.score / 100 + (r() - 0.5) * 0.08)));
      seedAttempts(d, u.id, sk, 8, r);
      d.learned[u.id] = {}; DATA.TOPICS.forEach((t) => { if (r() < p.score / 100) d.learned[u.id][t.id] = Date.now() - Math.floor(r() * 12) * 864e5; });
    });
    seedAttempts(d, dunyo.id, { analiz: 0.82, algebra: 0.66, ehtimol: 0.55, statistika: 0.6, dastur: 0.46, diftenglama: 0.32, diskret: 0.72 }, 14, r);
    d.learned[dunyo.id] = {};
    ["a1", "a2", "a3", "a4", "a5", "b1", "b2", "b3", "c1", "c2", "d1", "e1", "e2", "g1", "g2"].forEach((t, i) => (d.learned[dunyo.id][t] = Date.now() - (15 - i) * 0.7 * 864e5));
    const today = U.dayKey(), tomorrow = U.dayKey(new Date(Date.now() + 864e5)), in2 = U.dayKey(new Date(Date.now() + 2 * 864e5));
    d.events.push(
      { id: U.uid("ev"), uid: dunyo.id, date: today, time: "10:00", title: "Matematik analiz", sub: "Mavzu: Limit va uzluksizlik", kind: "topic", ref: "a2", done: true },
      { id: U.uid("ev"), uid: dunyo.id, date: today, time: "14:00", title: "Chiziqli algebra", sub: "Mavzu: Matritsalar", kind: "topic", ref: "b1", done: false },
      { id: U.uid("ev"), uid: dunyo.id, date: today, time: "17:00", title: "Test sinovi", sub: "Ehtimollar nazariyasi asoslari", kind: "test", ref: "t-ehtimol", done: false },
      { id: U.uid("ev"), uid: dunyo.id, date: tomorrow, time: "15:00", title: "Chiziqli algebra: Test", sub: "Matritsalar va determinantlar", kind: "test", ref: "t-matritsa", done: false },
      { id: U.uid("ev"), uid: dunyo.id, date: in2, time: "10:00", title: "Differensial tenglamalar", sub: "Mavzu: Koshi masalasi", kind: "topic", ref: "f4", done: false },
    );
    d.goals.push(
      { id: U.uid("g"), uid: dunyo.id, type: "subject", s: "analiz", target: 100, title: "Matematik analizni to'liq o'rganish", createdAt: Date.now() - 6 * 864e5 },
      { id: U.uid("g"), uid: dunyo.id, type: "tests", s: "dastur", target: 3, title: "Dasturlash bo'yicha 3 ta testni yechish", createdAt: Date.now() - 3 * 864e5 },
    );
    const aid = U.uid("as"), dl = U.dayKey(new Date(Date.now() + 3 * 864e5));
    d.assignments.push({ id: aid, by: ustoz.id, title: "Matematik analiz: Nazorat testi", s: "analiz", topics: ["a2", "a3", "a5"], count: 8, minutes: 15, deadline: dl, group: "AM-21", createdAt: Date.now() - 864e5,
      qids: DATA.QUESTIONS.filter((q) => ["a2", "a3", "a5"].includes(q.t)).slice(0, 8).map((q) => q.id) });
    d.events.push({ id: U.uid("ev"), uid: dunyo.id, date: dl, time: "14:00", title: "Matematik analiz: Test", sub: "Ustoz topshirig'i", kind: "assign", ref: aid, done: false });
    d.notifs.push(
      { id: U.uid("n"), uid: dunyo.id, ts: Date.now() - 864e5, text: "R. Karimov yangi test topshirig'i berdi: «Matematik analiz: Nazorat testi»", read: false, link: "#/testlar" },
      { id: U.uid("n"), uid: dunyo.id, ts: Date.now() - 2 * 864e5, text: "«Determinantlar» mavzusini takrorlash vaqti keldi — bilim xaritasini ko'ring.", read: false, link: "#/progress" },
    );
    d.attempts.filter((a) => a.uid === dunyo.id).slice(-4).forEach((a) => d.activity.push({ id: U.uid("ac"), uid: dunyo.id, ts: a.finishedAt, kind: "test", title: `${subjName(a.s)} – Test natijasi`, val: a.pct + "%" }));
    d.activity.push({ id: U.uid("ac"), uid: dunyo.id, ts: Date.now() - 3.6e6 * 5, kind: "topic", title: "Chiziqli algebra – Mavzu o'qildi", val: "" });
    d.chats.push({ id: U.uid("ch"), uid: dunyo.id, title: "Ikki o'zgaruvchili funksiya hosilasi", ts: Date.now() - 3.6e6 * 3, msgs: [] });
    d.secLog.push({ ts: Date.now() - 3.6e6 * 30, email: "noma'lum@pmedu.uz", ok: false });
    return d;
  }
  const subjName = (id) => (DATA.SUBJECTS.find((s) => s.id === id) || {}).name || id;

  function init() {
    db = read();
    if (!db || db.v !== 1) { db = seed(); save(); }
    return db;
  }
  function reset() { db = seed(); save(); }

  /* ---------- Autentifikatsiya ---------- */
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function current() {
    if (!db.session) return null;
    if (Date.now() > db.session.exp) { db.session = null; save(); return null; }
    const u = db.users.find((x) => x.id === db.session.uid);
    return u && !u.blocked ? u : null;
  }
  function login(email, password, remember) {
    email = String(email || "").trim().toLowerCase();
    const lk = db.lock[email];
    if (lk && lk.until > Date.now()) {
      const m = Math.ceil((lk.until - Date.now()) / 60000);
      throw new Error(`Ko'p marta noto'g'ri urinish. ${m} daqiqadan so'ng qayta urinib ko'ring.`);
    }
    const u = db.users.find((x) => x.email === email);
    const ok = u && SHA256.pass(password, u.salt) === u.hash;
    db.secLog.unshift({ ts: Date.now(), email, ok: !!ok }); db.secLog = db.secLog.slice(0, 200);
    if (!ok) {
      const prev = lk ? (lk.until && lk.until <= Date.now() ? 0 : lk.fails) : 0;
      const f = prev + 1;
      db.lock[email] = { fails: f, until: f >= MAX_FAILS ? Date.now() + LOCK_MIN * 60000 : 0 };
      save();
      const left = MAX_FAILS - f;
      throw new Error(left > 0 ? `Email yoki parol noto'g'ri. Qolgan urinishlar: ${left}.` : `Hisob ${LOCK_MIN} daqiqaga bloklandi.`);
    }
    if (u.blocked) { save(); throw new Error("Hisobingiz administrator tomonidan bloklangan."); }
    delete db.lock[email];
    db.session = { uid: u.id, exp: Date.now() + (remember ? 7 * 24 : SESSION_HOURS) * 3.6e6 };
    save();
    return u;
  }
  function validatePassword(pw) {
    if (!pw || pw.length < 8) return "Parol kamida 8 ta belgidan iborat bo'lsin.";
    if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return "Parolda harf va raqam bo'lishi kerak.";
    return "";
  }
  function register(o) {
    const email = String(o.email || "").trim().toLowerCase();
    if (!EMAIL_RE.test(email)) throw new Error("Email manzil noto'g'ri.");
    if (db.users.some((x) => x.email === email)) throw new Error("Bu email bilan hisob allaqachon mavjud.");
    const pe = validatePassword(o.password); if (pe) throw new Error(pe);
    const first = String(o.first || "").trim(), last = String(o.last || "").trim();
    if (first.length < 2 || first.length > 40) throw new Error("Ismni to'g'ri kiriting.");
    if (last.length < 2 || last.length > 40) throw new Error("Familiyani to'g'ri kiriting.");
    const u = mkUser({ email, password: o.password, first, last, uni: o.uni, faculty: o.faculty, course: +o.course || 1, year: o.year, group: String(o.group || "").slice(0, 20) });
    db.users.push(u); db.learned[u.id] = {};
    db.notifs.push({ id: U.uid("n"), uid: u.id, ts: Date.now(), text: "PM Edu ga xush kelibsiz! Birinchi qadam — «Fanlar» bo'limidan mavzu tanlang.", read: false, link: "#/fanlar" });
    db.session = { uid: u.id, exp: Date.now() + SESSION_HOURS * 3.6e6 };
    save();
    return u;
  }
  function logout() { db.session = null; save(); }
  function changePassword(oldPw, newPw) {
    const u = current(); if (!u) throw new Error("Avval tizimga kiring.");
    if (SHA256.pass(oldPw, u.salt) !== u.hash) throw new Error("Joriy parol noto'g'ri.");
    const pe = validatePassword(newPw); if (pe) throw new Error(pe);
    u.salt = SHA256.salt(); u.hash = SHA256.pass(newPw, u.salt); save();
  }
  function need(...roles) {
    const u = current();
    if (!u) throw new Error("Avval tizimga kiring.");
    if (roles.length && !roles.includes(u.role)) throw new Error("Bu amal uchun ruxsat yo'q.");
    return u;
  }
  const get = () => db;
  const isPersistent = () => persistent;
  return { init, reset, save, get, current, login, register, logout, changePassword, need, validatePassword, isPersistent, subjName, EMAIL_RE };
})();

  const user = (id) => db().users.find((u) => u.id === id);
  const fullName = (u) => u ? `${u.first} ${u.last}`.trim() : "—";
  const shuffle = (arr, r = Math.random) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const log = (uid, kind, title, val = "") => { db().activity.unshift({ id: U.uid("ac"), uid, ts: Date.now(), kind, title, val }); db().activity = db().activity.slice(0, 400); };
  const notify = (uid, text, link = "") => db().notifs.unshift({ id: U.uid("n"), uid, ts: Date.now(), text, read: false, link });

  /* ---------- O'zlashtirish modeli (Ebbinghaus unutish egri chizig'i asosida) ---------- */
  function answersByTopic(uid) {
    const m = {};
    db().attempts.filter((a) => a.uid === uid).sort((a, b) => a.finishedAt - b.finishedAt).forEach((a) =>
      a.items.forEach((it) => { (m[it.t] = m[it.t] || []).push({ ok: it.ok, ts: a.finishedAt }); }));
    return m;
  }
  function mastery(uid, tid, cache) {
    const ans = (cache || answersByTopic(uid))[tid] || [];
    const learnedTs = (db().learned[uid] || {})[tid];
    const last8 = ans.slice(-8), n = last8.length;
    const acc = n ? last8.filter((x) => x.ok).length / n : 0;
    const lastTs = Math.max(learnedTs || 0, ans.length ? ans[ans.length - 1].ts : 0);
    const days = lastTs ? (Date.now() - lastTs) / 864e5 : 0;
    const strength = 6 + 3 * Math.min(10, ans.filter((x) => x.ok).length);
    const retention = lastTs ? Math.exp(-days / strength) : 0;
    const base = n ? acc * 100 : learnedTs ? 45 : 0;
    const score = Math.round(base * (0.6 + 0.4 * retention));
    let level = "new";
    if (n || learnedTs) {
      if (n && acc < 0.6) level = "weak";
      else if (retention < 0.4) level = "review";
      else if (n && acc >= 0.8) level = "good";
      else level = "mid";
    }
    return { tid, n, acc, retention, score, level, learned: !!learnedTs, days: Math.round(days) };
  }
  const LEVELS = {
    new: { label: "Boshlanmagan", cls: "gr" }, weak: { label: "Zaif", cls: "r" }, review: { label: "Takrorlash kerak", cls: "o" },
    mid: { label: "O'rtacha", cls: "bl" }, good: { label: "O'zlashtirilgan", cls: "g" },
  };
  function knowledgeMap(uid) { const c = answersByTopic(uid); return DATA.TOPICS.map((t) => ({ ...mastery(uid, t.id, c), topic: t })); }

  function subjectStats(uid, s) {
    const c = answersByTopic(uid), ts = topicsOf(s);
    const ms = ts.map((t) => mastery(uid, t.id, c));
    const at = db().attempts.filter((a) => a.uid === uid && a.s === s);
    const learned = ms.filter((m) => m.learned).length;
    const avgM = ms.length ? Math.round(ms.reduce((x, m) => x + m.score, 0) / ms.length) : 0;
    return { total: ts.length, learned, mastery: avgM, tests: at.length, avgPct: at.length ? Math.round(at.reduce((x, a) => x + a.pct, 0) / at.length) : 0,
      progress: Math.round(0.5 * U.pct(learned, ts.length) + 0.5 * avgM) };
  }
  function overall(uid) {
    const learned = Object.keys(db().learned[uid] || {}).length, total = DATA.TOPICS.length;
    const at = db().attempts.filter((a) => a.uid === uid);
    const items = at.flatMap((a) => a.items), okN = items.filter((i) => i.ok).length;
    const km = knowledgeMap(uid), avgM = Math.round(km.reduce((x, m) => x + m.score, 0) / km.length);
    const avgPct = at.length ? at.reduce((x, a) => x + a.pct, 0) / at.length : 0;
    return { learned, total, tests: at.length, answered: items.length, correctPct: U.pct(okN, items.length), wrongPct: U.pct(items.length - okN, items.length),
      grade: at.length ? Math.max(2, Math.min(5, avgPct / 20)).toFixed(1) : "—", progress: Math.round(0.5 * U.pct(learned, total) + 0.5 * avgM), avgPct: Math.round(avgPct) };
  }
  function recommendations(uid, n = 4) {
    const u = user(uid), km = knowledgeMap(uid);
    const courseSubj = DATA.SUBJECTS.filter((s) => !u || s.courses.includes(+u.course) || s.courses.includes(+u.course - 1)).map((s) => s.id);
    const prio = { review: 0, weak: 1, mid: 3, new: 2, good: 9 };
    return km.filter((m) => m.level !== "good").sort((a, b) => (prio[a.level] - prio[b.level]) || (courseSubj.includes(b.topic.s) - courseSubj.includes(a.topic.s)) || a.score - b.score)
      .slice(0, n).map((m) => ({ ...m, reason: m.level === "review" ? `${m.days} kun oldin o'rganilgan — xotirada ${Math.round(m.retention * 100)}% qolgan` : m.level === "weak" ? `To'g'ri javoblar ${Math.round(m.acc * 100)}% — mustahkamlash kerak` : m.level === "new" ? "Hali boshlanmagan mavzu" : "Natijani 80% dan oshiring" }));
  }
  function mistakes(uid) {
    const last = {};
    db().attempts.filter((a) => a.uid === uid).sort((a, b) => a.finishedAt - b.finishedAt).forEach((a) => a.items.forEach((it) => { if (it.qid) last[it.qid] = it.ok; }));
    return Object.keys(last).filter((k) => !last[k]).map(question).filter(Boolean);
  }
  function streak(uid) {
    const days = new Set(db().attempts.filter((a) => a.uid === uid).map((a) => U.dayKey(new Date(a.finishedAt))));
    Object.values(db().learned[uid] || {}).forEach((ts) => days.add(U.dayKey(new Date(ts))));
    let n = 0, d = new Date(); if (!days.has(U.dayKey(d))) d = new Date(Date.now() - 864e5);
    while (days.has(U.dayKey(d))) { n++; d = new Date(d.getTime() - 864e5); }
    return n;
  }
  function timeline(uid, days = 7) {
    const at = db().attempts.filter((a) => a.uid === uid).sort((a, b) => a.finishedAt - b.finishedAt);
    const out = [];
    for (let k = days - 1; k >= 0; k--) {
      const end = U.fromKey(U.dayKey(new Date(Date.now() - k * 864e5))).getTime() + 864e5;
      const upto = at.filter((a) => a.finishedAt < end && a.finishedAt >= end - 14 * 864e5);
      const items = upto.flatMap((a) => a.items);
      out.push({ label: `${new Date(end - 1).getDate()}-${U.OYLAR[new Date(end - 1).getMonth()].slice(0, 3)}`, v: items.length ? U.pct(items.filter((i) => i.ok).length, items.length) : null,
        n: at.filter((a) => a.finishedAt < end && a.finishedAt >= end - 864e5).length });
    }
    let prev = null; out.forEach((p) => { if (p.v == null) p.v = prev ?? 0; prev = p.v; });
    return out;
  }
  function leaderboard(group) {
    return db().users.filter((u) => u.role === "student" && !u.blocked && (!group || u.group === group)).map((u) => {
      const at = db().attempts.filter((a) => a.uid === u.id).slice(-10);
      return { u, score: at.length ? Math.round(at.reduce((x, a) => x + a.pct, 0) / at.length) : 0, tests: at.length };
    }).sort((a, b) => b.score - a.score);
  }
  function achievements(uid) {
    const at = db().attempts.filter((a) => a.uid === uid), learned = Object.keys(db().learned[uid] || {}).length;
    const aiQ = db().chats.filter((c) => c.uid === uid).reduce((x, c) => x + c.msgs.filter((m) => m.role === "me").length, 0);
    return [
      { ic: "test", t: "Birinchi test", on: at.length >= 1 }, { ic: "fire", t: "3 kunlik seriya", on: streak(uid) >= 3 },
      { ic: "star", t: "100% natija", on: at.some((a) => a.pct === 100) }, { ic: "book", t: "10 ta mavzu", on: learned >= 10 },
      { ic: "trophy", t: "10 ta test", on: at.length >= 10 }, { ic: "bot", t: "AI bilan 10 savol", on: aiQ >= 10 },
      { ic: "repeat", t: "Xatolar ustida ishlash", on: at.some((a) => a.mode === "mistakes") },
    ];
  }

  /* ---------- Mavzularni o'rganish ---------- */
  function toggleLearned(tid) {
    const u = Store.need("student"); const L = (db().learned[u.id] = db().learned[u.id] || {});
    if (L[tid]) delete L[tid]; else { L[tid] = Date.now(); log(u.id, "topic", `${subj(topic(tid).s).name} – Mavzu o'qildi`, topic(tid).name); }
    Store.save(); return !!L[tid];
  }

  /* ---------- Parametrik savollar generatori: har urinishda yangi sonlar (ko'chirishga qarshi) ---------- */
  const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  const opts = (r, correct, wrongs) => {
    const set = [String(correct)]; wrongs.map(String).forEach((w) => { if (!set.includes(w) && set.length < 4) set.push(w); });
    let k = 1; while (set.length < 4) { const w = String(+correct + k * (k % 2 ? 1 : -1)); if (!set.includes(w)) set.push(w); k++; }
    const o = shuffle(set, r); return { o, a: o.indexOf(String(correct)) };
  };
  const C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i; return Math.round(r); };
  const GEN = {
    a3: (r) => { const a = ri(r, 2, 6), n = ri(r, 2, 4), b = ri(r, 1, 9), x0 = ri(r, 1, 3); const v = a * n * x0 ** (n - 1) + b;
      return { t: "a3", q: `f(x) = ${a}x${sup(n)} + ${b}x bo'lsa, f′(${x0}) = ?`, ...opts(r, v, [a * x0 ** n + b, a * n * x0 ** n + b, a * n * x0 ** (n - 1)]), e: `f′(x) = ${a * n}x${sup(n - 1)} + ${b} ⇒ f′(${x0}) = ${v}.` }; },
    a6: (r) => { const a = ri(r, 1, 4) * 3, b = ri(r, 1, 3); const v = (a / 3) * b ** 3;
      return { t: "a6", q: `∫₀${sup(b)} ${a}x² dx = ?`, ...opts(r, v, [a * b ** 2, a * b ** 3, (a / 2) * b ** 2]), e: `${a}·x³/3 |₀${sup(b)} = ${a / 3}·${b ** 3} = ${v}.` }; },
    b2: (r) => { const [a, b, c, d] = [ri(r, -5, 7), ri(r, -4, 6), ri(r, -3, 6), ri(r, 1, 8)]; const v = a * d - b * c;
      return { t: "b2", q: `|${a} ${b}; ${c} ${d}| determinant qiymati:`, ...opts(r, v, [a * d + b * c, b * c - a * d, a * c - b * d]), e: `${a}·${d} − (${b})·(${c}) = ${v}.` }; },
    b5: (r) => { const a = [ri(r, -3, 5), ri(r, -3, 5), ri(r, 1, 5)], b = [ri(r, -3, 5), ri(r, 1, 5), ri(r, -3, 5)]; const v = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      return { t: "b5", q: `a = (${a.join(", ")}), b = (${b.join(", ")}). a·b = ?`, ...opts(r, v, [v + 2, v - 3, a[0] * b[0] + a[1] * b[1]]), e: `${a.map((x, i) => `${x}·${b[i]}`).join(" + ")} = ${v}.` }; },
    c1: (r) => { const n = ri(r, 5, 10), k = ri(r, 2, 3); const v = C(n, k);
      return { t: "c1", q: `${n} ta talabadan ${k} kishilik guruhni necha usulda tanlash mumkin?`, ...opts(r, v, [v * (k === 2 ? 2 : 6), n * k, C(n, k + 1)]), e: `C${subDigits(n)}${sup(k)} = ${n}!/(${k}!·${n - k}!) = ${v}.` }; },
    c2: (r) => { const w = ri(r, 2, 6), b = ri(r, 2, 6), v = `${w}/${w + b}`;
      return { t: "c2", q: `Qutida ${w} ta oq va ${b} ta qora shar bor. Tasodifan olingan shar oq bo'lish ehtimoli:`, ...opts(r, v, [`${b}/${w + b}`, `${w}/${b}`, `1/${w + b}`]), e: `P = m/n = ${w}/${w + b}.` }; },
    d1: (r) => { const xs = Array.from({ length: 5 }, () => ri(r, 1, 12)); const sum = xs.reduce((a, b) => a + b, 0); const v = +(sum / 5).toFixed(1);
      return { t: "d1", q: `${xs.join(", ")} tanlanmaning o'rtacha qiymati:`, ...opts(r, v, [+(v + 1).toFixed(1), sum, [...xs].sort((a, b) => a - b)[2]]), e: `${sum}/5 = ${v}.` }; },
    e1: (r) => { const a = ri(r, 11, 40), b = ri(r, 3, 7);
      return { t: "e1", q: `Python: print(${a} // ${b}, ${a} % ${b}) natijasi:`, ...opts(r, `${Math.floor(a / b)} ${a % b}`, [`${(a / b).toFixed(1)} ${a % b}`, `${a % b} ${Math.floor(a / b)}`, `${Math.floor(a / b) + 1} ${a % b}`]), e: `// — butun bo'linma, % — qoldiq.` }; },
    f3: (r) => { const p = ri(r, 1, 4), q = ri(r, p + 1, 6);
      return { t: "f3", q: `y″ − ${p + q}y′ + ${p * q}y = 0 tenglamaning umumiy yechimi:`, ...opts(r, `C₁e${sup(p === 1 ? "x" : p + "x")} + C₂e${sup(q + "x")}`, [`C₁e${sup("-" + p + "x")} + C₂e${sup("-" + q + "x")}`, `C₁cos ${p}x + C₂sin ${q}x`, `(C₁ + C₂x)e${sup(p + "x")}`]), e: `k² − ${p + q}k + ${p * q} = 0 ⇒ k = ${p}, ${q}.` }; },
    g3: (r) => { const n = ri(r, 4, 12); const v = (n * (n - 1)) / 2;
      return { t: "g3", q: `K${subDigits(n)} to'liq grafda nechta qirra bor?`, ...opts(r, v, [n * (n - 1), n * n, n - 1]), e: `n(n − 1)/2 = ${n}·${n - 1}/2 = ${v}.` }; },
  };
  function sup(s) { const m = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹", "-": "⁻", "+": "⁺", x: "ˣ", n: "ⁿ", "(": "⁽", ")": "⁾" }; s = String(s); return [...s].every((c) => m[c]) ? [...s].map((c) => m[c]).join("") : `^(${s})`; }
  function subDigits(s) { const m = "₀₁₂₃₄₅₆₇₈₉"; return String(s).replace(/\d/g, (d) => m[d]); }
  const genTopics = Object.keys(GEN);

  /* ---------- Test sessiyasi ---------- */
  function prepare(q, r) {
    const idx = shuffle([0, 1, 2, 3], r);
    return { ...q, o: idx.map((i) => q.o[i]), a: idx.indexOf(q.a) };
  }
  function startTest(cfg) {
    const u = Store.need("student");
    let title, s, qs, minutes, ref = null, mode = "test";
    if (cfg.testId) {
      const t = test(cfg.testId); title = t.title; s = t.s;
      qs = shuffle(DATA.QUESTIONS.filter((q) => t.topics.includes(q.t))).slice(0, 10);
      const gt = t.topics.filter((x) => GEN[x]); if (gt.length) qs = qs.slice(0, 8).concat([GEN[gt[0]](Math.random), GEN[gt[gt.length - 1]](Math.random)]);
      ref = t.id;
    } else if (cfg.assignId) {
      const as = db().assignments.find((a) => a.id === cfg.assignId); if (!as) throw new Error("Topshiriq topilmadi.");
      title = as.title; s = as.s; qs = as.qids.map(question).filter(Boolean); minutes = as.minutes; ref = as.id; mode = "assign";
    } else if (cfg.mode === "mistakes") {
      qs = shuffle(mistakes(u.id)).slice(0, 10); if (!qs.length) throw new Error("Xatolar daftaringiz bo'sh — ajoyib!");
      title = "Xatolar ustida ishlash"; s = qs[0].t ? topic(qs[0].t).s : "analiz"; mode = "mistakes";
    } else if (cfg.mode === "adaptive") {
      const rec = recommendations(u.id, 5).map((m) => m.tid);
      qs = rec.flatMap((tid) => shuffle(DATA.QUESTIONS.filter((q) => q.t === tid)).slice(0, 2));
      rec.filter((tid) => GEN[tid]).slice(0, 2).forEach((tid) => qs.push(GEN[tid](Math.random)));
      if (qs.length < 4) qs = qs.concat(shuffle(DATA.QUESTIONS).slice(0, 6));
      qs = qs.slice(0, 10); title = "Moslashuvchan test (zaif mavzular)"; s = topic(qs[0].t).s; mode = "adaptive";
    } else if (cfg.mode === "gen") {
      const pool = cfg.s ? genTopics.filter((t) => topic(t).s === cfg.s) : genTopics;
      qs = Array.from({ length: 8 }, (_, i) => GEN[pool[i % pool.length]](Math.random)); title = "Cheksiz mashq (generator)"; s = topic(qs[0].t).s; mode = "gen";
    } else if (cfg.s) {
      const t = subj(cfg.s); title = t.name + ": umumiy test"; s = t.id;
      qs = shuffle(DATA.QUESTIONS.filter((q) => topic(q.t).s === s)).slice(0, 12); ref = "all-" + s;
    } else throw new Error("Test turi noma'lum.");
    qs = qs.map((q) => prepare(q, Math.random));
    return { id: U.uid("ses"), title, s, qs, answers: qs.map(() => null), flags: qs.map(() => false), startedAt: Date.now(), limitSec: (minutes || Math.max(5, Math.ceil(qs.length * 1.5))) * 60, ref, mode };
  }
  function submitTest(ses) {
    const u = Store.need("student");
    const items = ses.qs.map((q, i) => ({ qid: q.id || null, t: q.t, given: ses.answers[i], ok: ses.answers[i] === q.a, gen: q.id ? null : { q: q.q, o: q.o, a: q.a, e: q.e }, o: q.o, a: q.a }));
    const score = items.filter((i) => i.ok).length;
    const at = { id: U.uid("at"), uid: u.id, testId: ses.ref, title: ses.title, s: ses.s, startedAt: ses.startedAt, finishedAt: Date.now(), items, score, total: items.length, pct: U.pct(score, items.length), mode: ses.mode };
    db().attempts.push(at);
    log(u.id, "test", `${ses.title} – Test natijasi`, at.pct + "%");
    db().events.filter((e) => e.uid === u.id && e.ref === ses.ref && !e.done).forEach((e) => (e.done = true));
    if (ses.mode === "assign") { const as = db().assignments.find((a) => a.id === ses.ref); if (as) notify(as.by, `${fullName(u)} «${as.title}» topshirig'ini bajardi: ${at.pct}%`, "#/ustoz"); }
    if (at.pct === 100) notify(u.id, `Ajoyib! «${ses.title}» testida 100% natija. Yangi yutuq ochildi.`, "#/progress");
    const weakT = [...new Set(items.filter((i) => !i.ok).map((i) => i.t))];
    if (weakT.length) notify(u.id, `Tavsiya: «${topic(weakT[0]).name}» mavzusini takrorlang — testda xato bo'ldi.`, `#/fan/${topic(weakT[0]).s}`);
    Store.save(); return at;
  }
  const attemptsOf = (uid) => db().attempts.filter((a) => a.uid === uid).sort((a, b) => b.finishedAt - a.finishedAt);
  const itemQuestion = (it) => (it.qid ? { ...question(it.qid), o: it.o || question(it.qid).o, a: it.a ?? question(it.qid).a } : { ...it.gen, t: it.t });

  /* ---------- Maqsadlar ---------- */
  function goals(uid) {
    return db().goals.filter((g) => g.uid === uid).map((g) => {
      let p = 0, note = "";
      if (g.type === "subject") { const st = subjectStats(uid, g.s); p = U.pct(st.learned, st.total); note = `${st.learned} / ${st.total} mavzu`; }
      else if (g.type === "tests") { const n = db().attempts.filter((a) => a.uid === uid && a.s === g.s && a.finishedAt >= g.createdAt).length; p = U.pct(Math.min(n, g.target), g.target); note = `${Math.min(n, g.target)} / ${g.target} test`; }
      else if (g.type === "score") { const st = subjectStats(uid, g.s); p = U.clamp(U.pct(st.avgPct, g.target), 0, 100); note = `${st.avgPct}% / ${g.target}%`; }
      return { ...g, p, note, done: p >= 100 };
    });
  }
  function addGoal(o) {
    const u = Store.need("student");
    if (!subj(o.s)) throw new Error("Fanni tanlang.");
    const target = o.type === "subject" ? 100 : U.clamp(+o.target || 0, 1, o.type === "score" ? 100 : 50);
    const title = o.type === "subject" ? `${subj(o.s).name}ni to'liq o'rganish` : o.type === "tests" ? `${subj(o.s).name} bo'yicha ${target} ta testni yechish` : `${subj(o.s).name}: o'rtacha natija ${target}%`;
    db().goals.push({ id: U.uid("g"), uid: u.id, type: o.type, s: o.s, target, title, createdAt: Date.now() }); Store.save();
  }
  function removeGoal(id) { const u = Store.need(); db().goals = db().goals.filter((g) => !(g.id === id && g.uid === u.id)); Store.save(); }

  /* ---------- Kalendar / vazifalar ---------- */
  const events = (uid, date) => db().events.filter((e) => e.uid === uid && (!date || e.date === date)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  function addEvent(o) {
    const u = Store.need();
    const title = String(o.title || "").trim(); if (title.length < 2) throw new Error("Vazifa nomini kiriting.");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(o.date)) throw new Error("Sanani tanlang.");
    db().events.push({ id: U.uid("ev"), uid: u.id, date: o.date, time: /^\d{2}:\d{2}$/.test(o.time) ? o.time : "09:00", title: title.slice(0, 80), sub: String(o.sub || "").slice(0, 100), kind: "own", done: false }); Store.save();
  }
  function toggleEvent(id) { const u = Store.need(); const e = db().events.find((x) => x.id === id && x.uid === u.id); if (e) { e.done = !e.done; Store.save(); } }
  function removeEvent(id) { const u = Store.need(); db().events = db().events.filter((x) => !(x.id === id && x.uid === u.id)); Store.save(); }

  /* ---------- Bildirishnomalar ---------- */
  const notifs = (uid) => db().notifs.filter((n) => n.uid === uid).sort((a, b) => b.ts - a.ts).slice(0, 30);
  function readAll(uid) { db().notifs.forEach((n) => { if (n.uid === uid) n.read = true; }); Store.save(); }

    }

    if (has(t, ["transp"])) { const T = A[0].map((_, j) => A.map((r) => r[j])); return reply(`<p>Transponirlangan matritsa (qatorlar ↔ ustunlar):</p>${matHtml(T)}`, "Aᵀ", [], "b1"); }
    if (!sq) return reply(`<p>Bu amal uchun kvadrat matritsa kerak (${A.length}×${A[0].length} berildi).</p>`);
    const d = MC.detF(A);
    if (has(t, ["teskari", "inverse", "obratn", "^-1", "⁻¹"])) {
      if (MC.fz(d)) return reply(`<p>det A = 0 — matritsa xos (singulyar), <b>teskari matritsa mavjud emas</b>.</p>${matHtml(A)}`, "Mavjud emas", [], "b3");
      const inv = MC.inverseF(A);
      const s2 = n === 2 ? `<p class="small">Formula: A⁻¹ = (1/det A)·[d −b; −c a]</p>` : `<p class="small">Gauss–Jordan usuli: [A | E] → [E | A⁻¹]</p>`;
      return reply(`<p>Teskari matritsani topamiz:</p>${matHtml(A)}<p>det A = <b>${e(MC.fstr(d))}</b> ≠ 0 — teskari matritsa mavjud.</p>${s2}<p><b>Javob:</b> A⁻¹ =</p>${matHtml(inv)}<p class="small muted">Tekshiruv: A·A⁻¹ = E ✓</p>`, "A⁻¹", [{ label: "Matritsalar testi", cmd: "test:t-matritsa" }], "b3");
    }
    if (has(t, ["xos", "eigen", "sobstven", "xarakteristik"])) {
      const cp = MC.charPoly(A); if (!cp) return reply("<p>Xos qiymatlarni hozircha 2×2 va 3×3 matritsalar uchun hisoblayman.</p>");
      const r = MC.polyRoots(cp.map((c) => +c.toFixed(10)));
      const poly = MC.str(MC.fromPoly(cp, "λ".replace("λ", "x"))).replace(/x/g, "λ");
      let vecs = "";
      if (n === 2 && r.roots.length) { const [[a, b], [c, dd]] = A.map((row) => row.map(MC.fv)); vecs = `<p class="small">Xos vektorlar (A − λE)v = 0 dan:</p><ul class="small">${r.roots.map((l) => { const v = Math.abs(b) > 1e-12 ? [b, l - a] : Math.abs(c) > 1e-12 ? [l - dd, c] : (Math.abs(l - a) < 1e-9 ? [1, 0] : [0, 1]); return `<li>λ = ${e(MC.nice(l))}: v = (${e(MC.nice(v[0]))}; ${e(MC.nice(v[1]))})</li>`; }).join("")}</ul>`; }
      const ans = r.roots.length ? r.roots.map((l, i) => `λ${"₁₂₃"[i]} = ${MC.nice(l)}`).join(",  ") : r.complex ? `λ = ${MC.nice(r.complex[0])} ± ${MC.nice(Math.abs(r.complex[1]))}·i` : "—";
      return reply(`<p>Xos qiymatlar xarakteristik tenglamadan topiladi: det(A − λE) = 0</p>${matHtml(A)}${fm(poly + " = 0")}<p><b>Javob:</b></p>${fm(ans)}${vecs}<p class="small muted">Tekshiruv: λ yig'indisi = iz (tr A), ko'paytmasi = det A = ${e(MC.fstr(d))}</p>`, ans, [], "b6");
    }
    const a = A.map((r) => r.map(MC.fstr));
    let how = "";
    if (n === 2) how = steps([`2×2 formula: |a b; c d| = ad − bc`, `${a[0][0]}·${a[1][1]} − (${a[0][1]})·(${a[1][0]}) = <b>${e(MC.fstr(d))}</b>`]);
    else if (n === 3) {
      const mn = (i) => { const sub = A.slice(1).map((r) => r.filter((_, j) => j !== i)); return MC.detF(sub); };
      how = steps(["Birinchi qator bo'yicha yoyamiz: det A = a₁₁M₁₁ − a₁₂M₁₂ + a₁₃M₁₃", ...[0, 1, 2].map((i) => `M₁${i + 1} = ${e(MC.fstr(mn(i)))}`), `det A = ${a[0][0]}·(${e(MC.fstr(mn(0)))}) − (${a[0][1]})·(${e(MC.fstr(mn(1)))}) + (${a[0][2]})·(${e(MC.fstr(mn(2)))}) = <b>${e(MC.fstr(d))}</b>`]);
    } else how = steps(["Gauss usuli: matritsa uchburchak ko'rinishga keltiriladi", "Determinant — diagonal elementlar ko'paytmasi (qator almashtirishlar ishorani o'zgartiradi)"]);
    return reply(`<p>Determinantni hisoblaymiz:</p>${matHtml(A)}${how}<p><b>Javob:</b></p>${fm("det A = " + MC.fstr(d))}${MC.fz(d) ? `<p class="small">det A = 0 — matritsa xos, teskarisi mavjud emas.</p>` : ""}`, "det A = " + MC.fstr(d), [{ label: "Determinantlar testi", cmd: "test:t-matritsa" }], "b2");
  }

  /* ---------------- Kombinatorika va statistika ---------------- */
  const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
  const Cnk = (n, k) => Math.round(fact(n) / (fact(k) * fact(n - k)));
  function doCombo(text) {
    const t = text.replace(/\s+/g, "");
    let m = t.match(/\bC\(?(\d+)[,;](\d+)\)?/i) || (/kombinatsiya/i.test(U.norm(text)) && text.match(/(\d+)\D+(\d+)/));
    if (m) { const n = +m[1], k = +m[2]; if (k > n || n > 170) return null; const v = Cnk(n, k); return reply(`<p>Kombinatsiyalar soni (tartib muhim emas):</p>${fm(`C${sub(n)}${S.sup(k)} = ${n}! / (${k}!·${n - k}!) = ${v}`)}`, String(v), [], "c1"); }
    m = t.match(/\bA\(?(\d+)[,;](\d+)\)?/i) || (/orinlashtirish/i.test(U.norm(text)) && text.match(/(\d+)\D+(\d+)/));
    if (m) { const n = +m[1], k = +m[2]; if (k > n || n > 170) return null; const v = Math.round(fact(n) / fact(n - k)); return reply(`<p>O'rinlashtirishlar soni (tartib muhim):</p>${fm(`A${sub(n)}${S.sup(k)} = ${n}! / ${n - k}! = ${v}`)}`, String(v), [], "c1"); }
    m = text.match(/(\d+)\s*!/) || text.match(/\bP\((\d+)\)/i);
    if (m) { const n = +m[1]; if (n > 170) return null; const v = fact(n); return reply(`<p>Faktorial (o'rin almashtirishlar soni):</p>${fm(`${n}! = ${n <= 12 ? Array.from({ length: n }, (_, i) => i + 1).join("·") + " = " : ""}${v.toLocaleString("en-US").replace(/,/g, " ")}`)}`, String(v), [], "c1"); }
    return null;
  }
  const sub = (n) => String(n).replace(/\d/g, (d) => "₀₁₂₃₄₅₆₇₈₉"[d]);
  function doStats(text) {
    const nums = (text.replace(/[−–]/g, "-").match(/-?\d+(?:[.,]\d+)?/g) || []).map((x) => +x.replace(",", "."));
    if (nums.length < 3) return null;
    const n = nums.length, sorted = nums.slice().sort((a, b) => a - b), mean = nums.reduce((a, b) => a + b, 0) / n;
    const med = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
    const cnt = {}; nums.forEach((x) => (cnt[x] = (cnt[x] || 0) + 1)); const mx = Math.max(...Object.values(cnt)); const mode = mx > 1 ? Object.keys(cnt).filter((k) => cnt[k] === mx).join(", ") : "yo'q";
    const ss = nums.reduce((a, x) => a + (x - mean) ** 2, 0), vp = ss / n, vs = ss / (n - 1);
    const r = (x) => +x.toFixed(4);
    return reply(`<p>Tavsifiy statistika (n = ${n}):</p>
      <table><tr><td>Tartiblangan qator</td><td>${e(sorted.join(", "))}</td></tr><tr><td>O'rtacha x̄</td><td>${r(mean)}</td></tr><tr><td>Median</td><td>${r(med)}</td></tr><tr><td>Moda</td><td>${e(mode)}</td></tr>
      <tr><td>Qulach (max − min)</td><td>${r(sorted[n - 1] - sorted[0])}</td></tr><tr><td>Dispersiya (bosh to'plam, /n)</td><td>${r(vp)}</td></tr><tr><td>Tanlanma dispersiya (/n−1)</td><td>${r(vs)}</td></tr><tr><td>Standart chetlanish s</td><td>${r(Math.sqrt(vs))}</td></tr></table>
      <p class="small muted">x̄ = ∑xᵢ/n = ${r(nums.reduce((a, b) => a + b, 0))}/${n};  s² = ∑(xᵢ − x̄)²/(n − 1)</p>`, `x̄ = ${r(mean)}, median = ${r(med)}, s = ${r(Math.sqrt(vs))}`, [{ label: "Statistika testi", cmd: "test:t-regressiya" }], "d1");
  }

  /* ---------------- Bilimlar bazasi ---------------- */
  function findTopic(text) {
    const t = U.norm(text);
    let best = null, bs = 0;
    DATA.TOPICS.forEach((tp) => {
      let sc = 0; tp.kw.forEach((k) => { if (t.includes(U.norm(k))) sc += k.includes(" ") ? 3 : 2; });
      if (t.includes(U.norm(tp.name))) sc += 4;
      if (sc > bs) { bs = sc; best = tp; }
    });
    return bs >= 2 ? best : null;
  }
  function doTheory(text) {
    const tp = findTopic(text); if (!tp) return null;
    const s = DATA.SUBJECTS.find((x) => x.id === tp.s);
    const html = `<p><b>${e(tp.name)}</b> <span class="muted small">· ${e(s.name)}</span></p><p>${e(tp.theory)}</p>${tp.formulas.map(fm).join("")}<p><b>Misol:</b> ${e(tp.example)}</p>`;
    return reply(html, tp.theory, [{ label: "Mavzuni ochish", href: `#/fan/${tp.s}/${tp.id}` }, { label: "Mashq berish", cmd: "ask:" + tp.name + " bo'yicha mashq ber" }], tp.id);
  }
  function doSubject(text) {
    const t = U.norm(text); const s = DATA.SUBJECTS.find((x) => t.includes(U.norm(x.name)) || t.includes(U.norm(x.name.split(" ").pop())));
    if (!s) return null; const ts = DATA.TOPICS.filter((x) => x.s === s.id);
    return reply(`<p><b>${e(s.name)}</b> — ${e(s.desc)}</p><p>Asosiy mavzular va tushunchalar:</p><ol>${ts.map((x) => `<li><b>${e(x.name)}</b> — <span class="small">${e(x.theory.split(". ")[0])}.</span></li>`).join("")}</ol><p class="small muted">Istalgan mavzu haqida batafsil so'rang yoki «${e(s.name)} bo'yicha mashq ber» deb yozing.</p>`,
      s.desc, [{ label: "Fanni ochish", href: `#/fan/${s.id}` }]);
  }
  function doPractice(text) {
    const tp = findTopic(text); const u = Store.current();
    let tids = tp ? [tp.id] : u ? S.recommendations(u.id, 3).map((m) => m.tid) : ["a3", "b2", "c1"];
    const qs = [];
    tids.forEach((tid) => { if (S.GEN[tid]) qs.push(S.GEN[tid](Math.random), S.GEN[tid](Math.random)); DATA.QUESTIONS.filter((q) => q.t === tid).slice(0, 2).forEach((q) => qs.push(q)); });
    const pick = S.shuffle(qs).slice(0, 3);
    if (!pick.length) return null;
    const html = `<p>${tp ? `«${e(tp.name)}» mavzusi bo'yicha` : "Zaif mavzularingiz bo'yicha"} 3 ta mashq. Avval o'zingiz yeching, keyin javobni oching:</p>
      <ol>${pick.map((q) => `<li><b>${e(q.q)}</b><div class="small muted">${q.o.map((o, i) => `${"ABCD"[i]}) ${e(o)}`).join("   ")}</div><details class="small"><summary>Javobni ko'rish</summary>${"ABCD"[q.a]}) ${e(q.o[q.a])} — ${e(q.e)}</details></li>`).join("")}</ol>`;
    return reply(html, "Mashqlar", [{ label: "To'liq moslashuvchan test", cmd: "test:adaptive" }], tp ? tp.id : null);
  }
  function doRecommend() {
    const u = Store.current(); if (!u || u.role !== "student") return reply("<p>Shaxsiy tavsiyalar talaba hisobida ishlaydi.</p>");
    const rec = S.recommendations(u.id, 4);
    const html = `<p>Test natijalaringiz va unutish egri chizig'i (Ebbinghaus) asosida hozir quyidagilarni takrorlash foydali:</p>
      <ol>${rec.map((m) => `<li><b>${e(m.topic.name)}</b> <span class="badge ${S.LEVELS[m.level].cls}">${S.LEVELS[m.level].label}</span><div class="small muted">${e(m.reason)}</div></li>`).join("")}</ol>`;
    return reply(html, "Tavsiyalar", [{ label: "Moslashuvchan test", cmd: "test:adaptive" }, { label: "Bilim xaritasi", href: "#/progress" }]);
  }
  const CODE = {
    b2: "import numpy as np\nA = np.array([[1, 2], [3, 4]])\nprint(np.linalg.det(A))   # -2.0",
    b3: "import numpy as np\nA = np.array([[4, 7], [2, 6]])\nprint(np.linalg.inv(A))",
    b4: "import numpy as np\nA = np.array([[1, 1], [1, -1]])\nb = np.array([5, 1])\nprint(np.linalg.solve(A, b))   # [3. 2.]",
    b6: "import numpy as np\nA = np.array([[2, 1], [1, 2]])\nvals, vecs = np.linalg.eig(A)\nprint(vals)   # [3. 1.]",
    a3: "import sympy as sp\nx = sp.symbols('x')\nf = x**3 - 3*x\nprint(sp.diff(f, x))   # 3*x**2 - 3",
    a5: "import sympy as sp\nx = sp.symbols('x')\nprint(sp.integrate(x * sp.exp(x), x))   # (x - 1)*exp(x)",
    a6: "from scipy.integrate import quad\nimport numpy as np\nprint(quad(np.sin, 0, np.pi))   # (2.0, ...)",
    a2: "import sympy as sp\nx = sp.symbols('x')\nprint(sp.limit(sp.sin(x)/x, x, 0))   # 1",
    c1: "from math import comb, perm, factorial\nprint(comb(5, 2), perm(5, 2), factorial(4))   # 10 20 24",
    d1: "import statistics as st\ndata = [2, 4, 4, 4, 5, 5, 7, 9]\nprint(st.mean(data), st.median(data), st.stdev(data))",
    d4: "import numpy as np\nx = np.array([1, 2, 3, 4]); y = np.array([3, 5, 7, 9])\nb, a = np.polyfit(x, y, 1)\nprint(f'y = {a:.2f} + {b:.2f}x', np.corrcoef(x, y)[0, 1])",
    c5: "from scipy.stats import binom, norm\nprint(binom.pmf(2, 3, 0.5))   # 0.375\nprint(norm.cdf(1) - norm.cdf(-1))   # 0.6827",
  };
  function doCode(text) {
    const tp = findTopic(text) || { id: /determinant/.test(U.norm(text)) ? "b2" : "a3", name: "" };
    const code = CODE[tp.id] || CODE[{ analiz: "a3", algebra: "b2", ehtimol: "c1", statistika: "d1" }[tp.s]] || CODE.a3;
    return reply(`<p>Python'da shunday hisoblanadi${tp.name ? ` («${e(tp.name)}»)` : ""}:</p><pre class="formula" style="font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre">${e(code)}</pre><p class="small muted">sympy — simvolli hisoblash, numpy — sonli hisoblash kutubxonalari.</p>`, code, [], tp.id);
  }
  function doArith(text) {
    const s = text.replace(/[=?]+\s*$/, "").replace(/^\s*(hisobla\w*|hisob)\s*/i, "");
    if (!/^[\d\s+\-*/^().,√πe²³sincotaglqrxp]+$/i.test(s) || /[xyz]/i.test(s.replace(/exp|sqrt/gi, ""))) return null;
    const ex = tryParse(s); if (!ex || MC.vars(ex).size) return null;
    const v = MC.evaluate(ex); if (!isFinite(v)) return null;
    return reply(`${fm(`${MC.str(ex)} = ${MC.nice(v)}`)}${MC.nice(v) !== String(+v.toPrecision(10)) ? `<p class="small muted">≈ ${+v.toPrecision(10)}</p>` : ""}`, MC.nice(v));
  }

  const HELP = `<p>Men PM Edu AI yordamchiman — internet talab qilmaydigan matematik hisoblash yadrosi bilan ishlayman. Masalan, shunday yozing:</p>
    <ul><li><b>Hosila:</b> x^3*sin(x) hosilasi · z = x^2*y + sin(y) xususiy hosila</li><li><b>Integral:</b> integral x*e^x · integral sin(x) 0 dan pi gacha</li><li><b>Limit:</b> limit sin(x)/x, x->0</li>
    <li><b>Tenglama:</b> x^2 - 5x + 6 = 0 · sistema: 2x + y = 5; x - y = 1</li><li><b>Matritsa:</b> determinant [[1,2],[3,4]] · teskari [[2,1],[1,1]] · xos qiymat [[2,1],[1,2]]</li>
    <li><b>Kombinatorika / statistika:</b> C(10,3) · statistika 2, 4, 4, 5, 7</li><li><b>Nazariya:</b> Bayes formulasi nima? · Mashq ber · Nimani takrorlashim kerak?</li></ul>`;

  function answer(text) {
    const raw = String(text || "").trim(); if (!raw) return reply(HELP, "Yordam");

    try {
      if (has(t, ["salom", "assalom", "hello", "privet"]) && raw.length < 25) return reply(`<p>Salom! Qanday yordam bera olaman?</p>${HELP}`);
      if (has(t, ["nima qila olasan", "yordam", "imkoniyat", "help"]) && raw.length < 40) return reply(HELP);
      if (has(t, ["takrorla", "zaif", "tavsiya", "qaysi mavzu", "nimani oqi", "nima oqi"])) return doRecommend();
      if (has(t, ["mashq", "misol ber", "savol ber", "masala ber", "test savollari"])) return doPractice(raw) || doRecommend();
      if (has(t, ["python", "kod", "numpy", "sympy"])) return doCode(raw);
      if (/\[|\|[^|]*;/.test(raw) && (parseMatrices(raw).length)) { const r = doMatrix(raw); if (r) return r; }
      if ((raw.match(/=/g) || []).length >= 2) { const r = doSystem(raw); if (r) return r; }
      if (/\blim|limit/.test(t) || /->|→/.test(raw)) { const r = doLimit(raw); if (r) return r; }
      if (/integral|∫|boshlangich/.test(t)) { const r = doIntegral(raw); if (r) return r; }
      if (/hosila|derivativ|differensial|diff\b|d\/dx|∂|′/.test(t + raw)) { const r = doDerivative(raw); if (r) return r; }
      if ((raw.match(/=/g) || []).length === 1 && /[xyzt]/.test(raw)) { const r = doEquation(raw); if (r) return r; }
      { const r = doCombo(raw); if (r) return r; }
      if (has(t, ["ortacha", "median", "moda", "dispersiya", "statistika", "standart chetlanish", "tavsifiy"])) { const r = doStats(raw); if (r) return r; }
      { const r = doArith(raw); if (r) return r; }
      if (/nima\b|asosiy|haqida|tushuncha/.test(t) && DATA.SUBJECTS.some((x) => t.includes(U.norm(x.name)))) { const r = doSubject(raw); if (r) return r; }
      { const r = doTheory(raw); if (r) return r; }
      { const r = doSubject(raw); if (r) return r; }
    } catch (err) { return reply(`<p>Ifodani tushunishda xatolik: ${e(err.message)}. Iltimos, ko'rinishini tekshiring, masalan: <i>x^2*sin(x) hosilasi</i>.</p>`); }
    return reply(`<p>Savolingizni to'liq tushunmadim. ${HELP}</p>`, "Yordam");
  }
  const QUICK = ["Integral nima?", "Determinant qanday hisoblanadi?", "Chiziqli algebra asosiy tushunchalari", "Ehtimollar nazariyasida P(A) nima?", "Matematik statistika nima?"];
  return { answer, QUICK, extractExpr, findTopic };
})();

    <div class="field"><label for="rPass2">Parolni tasdiqlang</label><div class="inp">${I("lock")}<input class="in" id="rPass2" type="password" placeholder="Parolni qayta kiriting" value="${e(d.password || "")}" autocomplete="new-password"></div></div>
    <label class="check mb-s"><input type="checkbox" id="rTerms" ${d.terms ? "checked" : ""}> <span>Men <a data-act="terms" href="javascript:void 0">foydalanuvchi shartlari</a> va maxfiylik siyosatiga roziman.</span></label>
    <div class="err" id="rErr"></div><button class="btn block" data-act="regNext">Ro'yxatdan o'tish ${I("arrow", "sm")}</button>
    <div class="or">yoki</div><button class="btn ghost block" data-act="google">${I("google")} Google orqali davom etish</button>

    <div class="field mt"><label for="rFirst">Ism</label><div class="inp">${I("user")}<input class="in" id="rFirst" placeholder="Masalan: Dunyo" value="${e(d.first || "")}" maxlength="40"></div></div>
    <div class="field"><label for="rLast">Familiya</label><div class="inp">${I("user")}<input class="in" id="rLast" placeholder="Masalan: Tolipova" value="${e(d.last || "")}" maxlength="40"></div></div>
    <div class="err" id="rErr"></div><div class="row between"><button class="btn ghost" data-act="regBack">${I("back", "sm")} Orqaga</button><button class="btn" data-act="regNext">Keyingi ${I("arrow", "sm")}</button></div>`;
  if (s === 3) body = `${stepper}<h2>Ta'lim ma'lumotlari</h2><p class="muted">Sizning ta'lim ma'lumotlaringiz platformada shaxsiy kurslaringizni belgilashda yordam beradi.</p>
    <div class="field mt"><label for="rUni">Universitet</label><div class="inp">${I("bank")}<select class="in" id="rUni">${DATA.UNIVERSITIES.map((x) => `<option ${x === d.uni ? "selected" : ""}>${e(x)}</option>`).join("")}</select></div></div>
    <div class="field"><label for="rFac">Fakultet / yo'nalish</label><div class="inp">${I("cap")}<select class="in" id="rFac">${DATA.FACULTIES.map((x) => `<option ${x === d.faculty ? "selected" : ""}>${e(x)}</option>`).join("")}</select></div></div>
    <div class="field"><label>Nechanchi bosqich?</label><div class="seg">${[1, 2, 3, 4].map((k) => `<button type="button" class="${+d.course === k ? "on" : ""}" data-act="regCourse" data-id="${k}">${k}-kurs</button>`).join("")}</div></div>
    <div class="g g2" style="gap:12px"><div class="field"><label for="rYear">O'qish yili</label><div class="inp">${I("cal")}<select class="in" id="rYear">${DATA.YEARS.map((x) => `<option ${x === d.year ? "selected" : ""}>${x}</option>`).join("")}</select></div></div>
    <div class="field"><label for="rGroup">Guruh</label><div class="inp">${I("users")}<input class="in" id="rGroup" placeholder="AM-21" value="${e(d.group || "")}" maxlength="20"></div></div></div>
    <div class="err" id="rErr"></div><div class="row between"><button class="btn ghost" data-act="regBack">${I("back", "sm")} Orqaga</button><button class="btn" data-act="regNext">Keyingi ${I("arrow", "sm")}</button></div>`;
